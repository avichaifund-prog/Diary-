<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>יומן</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7480;--ac:#2563eb;--acx:#fff;--bd:#d9dde3;--sel:#dbeafe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2329;--tx:#eceff3;--mu:#9aa4b0;--ac:#60a5fa;--acx:#0b1220;--bd:#343b44;--sel:#1e3a5f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;max-width:560px;margin-inline:auto;padding:12px}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.q{margin-bottom:14px}
.q label.t{display:block;font-weight:600;margin-bottom:6px}
.q small{color:var(--mu);font-weight:400}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row button{flex:1 1 0;min-width:44px;padding:11px 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.row button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.bris{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bris button{flex:none;text-align:right;padding:8px 10px;font-size:13px;line-height:1.3;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px}
.bris button b{font-size:17px;margin-inline-end:4px}
.bris button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
input[type=date],input[type=time],input[type=number],textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px;font-family:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.main{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font-size:18px;font-weight:700}
.sec{background:transparent;border:1px solid var(--bd);color:var(--tx);padding:10px 12px;border-radius:10px;font-size:15px}
.ent{border-bottom:1px solid var(--bd);padding:8px 0;font-size:14px}
.ent:last-child{border:0}
.ent .h{display:flex;justify-content:space-between;font-weight:600}
.ent .d{color:var(--mu);margin-top:2px}
.del{background:none;border:0;color:#d33;font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;font-size:12px;width:100%}
th,td{border:1px solid #888;padding:3px 4px;text-align:center}
#pv{display:none}
@media print{body>*:not(#pv){display:none!important}#pv{display:block!important}body{max-width:none;padding:0}}
</style>
</head>
<body>
<h1>יומן</h1>

<div class="card" id="form">
  <div class="two q">
    <div><label class="t">תאריך</label><input type="date" id="date"></div>
    <div><label class="t">שעה</label><input type="time" id="time"></div>
  </div>
  <div class="q"><div class="row" id="ago"><button data-m="0">עכשיו</button><button data-m="60">לפני שעה</button><button data-m="120">לפני שעתיים</button><button data-m="180">לפני 3 שעות</button></div></div>
  <div class="q"><label class="t">הרגשת צורך ליציאה?</label><div class="row" data-k="urge"><button data-v="כן">כן</button><button data-v="לא">לא</button></div></div>
  <div class="q"><label class="t">האם הייתה יציאה?</label><div class="row" data-k="was"><button data-v="כן">כן</button><button data-v="לא">לא</button><button data-v="דלף">דלף</button></div></div>
  <div class="q"><label class="t">כמות צואה / דלף צואה <small>(0 עד 3)</small></label><div class="row" data-k="amt"><button data-v="0">0 ללא</button><button data-v="1">1 קטנה</button><button data-v="2">2 בינונית</button><button data-v="3">3 מרובה</button></div></div>
  <div class="q"><label class="t">צורת יציאה לפי סולם בריסטול</label>
    <div class="bris" data-k="bris">
      <button data-v="1"><b>1</b>גושים נפרדים, קשים</button>
      <button data-v="2"><b>2</b>נקניקייה גבשושית, קשה</button>
      <button data-v="3"><b>3</b>נקניקייה עם סדקים</button>
      <button data-v="4"><b>4</b>נקניקייה חלקה, רכה</button>
      <button data-v="5"><b>5</b>גושים רכים, יוצאים בקלות</button>
      <button data-v="6"><b>6</b>גושים מפוררים, דייסתיים</button>
      <button data-v="7"><b>7</b>מימי, ללא חלקים</button>
    </div></div>
  <div class="q"><label class="t">מאמץ להשגת יציאה</label><div class="row" data-k="eff"><button data-v="1">1 קל</button><button data-v="2">2 בינוני</button><button data-v="3">3 קשה</button></div></div>
  <div class="q"><label class="t">הרגשת התרוקנות מלאה?</label><div class="row" data-k="full"><button data-v="כן">כן</button><button data-v="לא">לא</button></div></div>
  <div class="q"><label class="t">כאב בטן</label><div class="row" data-k="pain"><button data-v="0">0 ללא</button><button data-v="1">1 קל</button><button data-v="2">2 בינוני</button><button data-v="3">3 קשה</button></div></div>
  <div class="q"><label class="t">עזרים ליציאה <small>(אפשר כמה)</small></label><div class="row" data-k="aid" data-multi="1"><button data-v="תרופות">תרופות</button><button data-v="חוקנים">חוקנים</button><button data-v="לחץ ידני">לחץ ידני</button></div></div>
  <div class="q"><label class="t">משך השהייה בשירותים <small>(דקות)</small></label><input type="number" id="dur" inputmode="numeric" min="0" placeholder="דקות"></div>
  <div class="q"><label class="t">הערות</label><textarea id="note" rows="2"></textarea></div>
  <button class="main" id="save">שמירה</button>
</div>

<div class="card">
  <b>רשומות (<span id="cnt">0</span>)</b>
  <div id="list"></div>
  <div class="q" style="margin-top:10px"><div style="font-weight:600">מספר אירועי דלף בשבוע האחרון: <span id="leaks">0</span></div></div>
  <div class="tools">
    <button class="sec" id="copy">העתקה כטקסט</button>
    <button class="sec" id="print">הדפסה / PDF</button>
    <button class="sec" id="clear">מחיקת הכול</button>
  </div>
</div>

<div id="pv"></div>

<script>
const KEY="bowel-diary-v1";
let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}
let cur={};
const $=s=>document.querySelector(s);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function now(m){const d=new Date(Date.now()-(m||0)*6e4),p=n=>String(n).padStart(2,"0");$("#date").value=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());$("#time").value=p(d.getHours())+":"+p(d.getMinutes())}
$("#ago").onclick=e=>{const b=e.target.closest("button");if(b)now(+b.dataset.m)};
document.querySelectorAll("[data-k]").forEach(g=>{
  g.addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;
    const k=g.dataset.k,v=b.dataset.v;
    if(g.dataset.multi){
      b.classList.toggle("on");
      cur[k]=[...g.querySelectorAll(".on")].map(x=>x.dataset.v);
    }else if(b.classList.contains("on")){b.classList.remove("on");delete cur[k]}
    else{g.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");cur[k]=v}
    // quick logic: no movement -> clear dependent fields hint
    if(k==="was"&&v==="לא"&&!cur.amt){setSel("amt","0")}
  });
});
function setSel(k,v){const g=document.querySelector('[data-k="'+k+'"]');g.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.v===v));cur[k]=v}
function reset(){cur={};document.querySelectorAll("[data-k] button").forEach(b=>b.classList.remove("on"));$("#dur").value="";$("#note").value="";now()}
function fd(s){const [y,m,d]=s.split("-");return d+"/"+m+"/"+y.slice(2)}
function row(e){return [fd(e.date),e.time,e.urge||"",e.was||"",e.amt||"",e.bris||"",e.eff||"",e.full||"",e.pain||"",(e.aid||[]).join(", "),e.dur||"",e.note||""]}
$("#save").onclick=()=>{
  const e={id:Date.now(),date:$("#date").value,time:$("#time").value,...cur,dur:$("#dur").value,note:$("#note").value.trim()};
  data.push(e);data.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));persist();reset();render();
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
};
function render(){
  $("#cnt").textContent=data.length;
  const L=$("#list");L.innerHTML="";
  [...data].reverse().forEach(e=>{
    const d=document.createElement("div");d.className="ent";
    const bits=[];
    if(e.was)bits.push("יציאה: "+e.was);
    if(e.bris)bits.push("בריסטול "+e.bris);
    if(e.amt)bits.push("כמות "+e.amt);
    if(e.eff)bits.push("מאמץ "+e.eff);
    if(e.pain)bits.push("כאב "+e.pain);
    if(e.full)bits.push("התרוקנות: "+e.full);
    if(e.aid&&e.aid.length)bits.push(e.aid.join(", "));
    if(e.dur)bits.push(e.dur+" דק׳");
    if(e.note)bits.push("«"+e.note+"»");
    d.innerHTML='<div class="h"><span></span><button class="del">מחיקה</button></div><div class="d"></div>';
    d.querySelector(".h span").textContent=fd(e.date)+" · "+e.time;
    d.querySelector(".d").textContent=bits.join(" · ");
    d.querySelector(".del").onclick=()=>{if(confirm("למחוק רשומה?")){data=data.filter(x=>x.id!==e.id);persist();render()}};
    L.appendChild(d);
  });
  const wk=Date.now()-7*864e5;
  $("#leaks").textContent=data.filter(e=>(e.was==="דלף"||+e.amt>0&&e.was==="דלף")&&new Date(e.date+"T"+(e.time||"00:00")).getTime()>=wk).length;
}
const heads=["תאריך","שעה","צורך?","הייתה יציאה?","כמות","בריסטול","מאמץ","התרוקנות","כאב בטן","עזרים","משך (דק׳)","הערות"];
$("#copy").onclick=async()=>{
  const t=[heads.join("\t"),...data.map(e=>row(e).join("\t"))].join("\n")+"\nאירועי דלף בשבוע האחרון: "+$("#leaks").textContent;
  try{await navigator.clipboard.writeText(t);$("#copy").textContent="הועתק ✓"}catch(e){prompt("העתק:",t)}
  setTimeout(()=>$("#copy").textContent="העתקה כטקסט",1800);
};
$("#print").onclick=()=>{
  const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  $("#pv").innerHTML="<h3>יומן</h3><table><tr>"+heads.map(h=>"<th>"+h+"</th>").join("")+"</tr>"+data.map(e=>"<tr>"+row(e).map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+"</table><p>מספר אירועי דלף בשבוע האחרון: "+$("#leaks").textContent+"</p>";
  window.print();
};
$("#clear").onclick=()=>{if(confirm("למחוק את כל הרשומות?")){data=[];persist();render()}};
now();render();
</script>
</body>
</html>
